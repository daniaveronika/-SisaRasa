<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Voucher Kasir | SisaRasa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="/css/voucher.css">

    <script defer src="/js/voucher.js"></script>
</head>

<body class="voucher-page">

    <!-- SIDEBAR -->

    <aside class="voucher-sidebar">

        <a class="brand" href="/">
            <img src="/assets/logo.svg" alt="SisaRasa">
        </a>

        <nav>

            <a class="nav-item" href="/">
                <span data-icon="dashboard"></span>
                Dashboard
            </a>

            <a class="nav-item" href="/pages/transaksi.html">
                <span data-icon="receipt"></span>
                Transaksi
            </a>

            <a class="nav-item" href="/pages/tenant.html">
                <span data-icon="store"></span>
                Tenant
            </a>

            <a class="nav-item active"
               href="/pages/voucher.html">
                <span data-icon="ticket"></span>
                Voucher
            </a>

        </nav>

        <button class="nav-item logout" id="logout">
            <span data-icon="logout"></span>
            Logout
        </button>

    </aside>

    <!-- MAIN CONTENT -->

    <main class="voucher-workspace">

        <header class="topbar">

            <h1>Voucher</h1>

            <div class="header-actions">

                <label class="search">

                    <span data-icon="search"></span>

                    <input type="search"
                           id="search"
                           placeholder="Cari voucher...">

                </label>

                <button class="icon-btn"
                        id="refresh"
                        title="Muat ulang data">

                    <span data-icon="refresh"></span>

                </button>

                <div class="profile">

                    <span class="avatar">B</span>

                    <div>
                        <strong>Bu Irma</strong>
                        <small>Kasir</small>
                    </div>

                </div>

            </div>

        </header>

        <!-- STATISTICS -->

        <section class="stats" id="stats"></section>

        <!-- ERROR MESSAGE -->

        <div id="error" class="error" role="alert" hidden></div>

        <!-- VOUCHER SECTION -->

        <section class="voucher-section">

            <div class="section-heading">

                <div>

                    <h2>Daftar Voucher</h2>

                    <p id="voucher-count">
                        Memuat data voucher...
                    </p>

                </div>

                <div class="filters">

                    <button class="filter active"
                            data-filter="all">
                        Semua
                    </button>

                    <button class="filter"
                            data-filter="active">
                        Aktif
                    </button>

                    <button class="filter"
                            data-filter="exhausted">
                        Habis
                    </button>

                </div>

            </div>

            <div class="voucher-grid" id="voucher-grid"></div>

        </section>

    </main>

    <!-- VOUCHER DETAIL POPUP -->

    <dialog id="detail-modal">

        <div class="modal-heading">

            <h2>Detail Voucher</h2>

            <button class="icon-btn"
                    id="close-modal"
                    aria-label="Tutup">
                ×
            </button>

        </div>

        <div id="modal-content"></div>

    </dialog>

    <div id="toast" class="toast" role="status" hidden></div>

</body>

</html>
